[project]
name = "software-engineering-bootcamp"
version = "0.1.0"
description = "Shared Python environment for Software Engineering Bootcamp exercises"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "strawberry-graphql[fastapi]",
    "grpcio",
    "grpcio-tools",
    "uuid",
    "sqlalchemy>=2.0"
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest"
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead:DeprecationWarning:starlette\\.testclient"
]